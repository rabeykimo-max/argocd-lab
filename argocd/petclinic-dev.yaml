apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rabeykimo-max/argocd-lab.git
    targetRevision: main
    path: apps/petclinic/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
